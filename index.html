<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixador de Vídeos Rápido</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 20px; font-size: 24px; color: #38bdf8; }
        input { padding: 12px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 2px solid #334155; border-radius: 6px; background: #0f172a; color: white; font-size: 16px; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-mp4 { background: #ea580c; color: white; }
        .btn-mp4:hover { background: #c2410c; }
        .btn-mp3 { background: #16a34a; color: white; }
        .btn-mp3:hover { background: #15803d; }
        .alerta { margin-top: 15px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Baixar Vídeo do YouTube</h1>
    <input type="text" id="urlVideo" placeholder="Cole o link do YouTube aqui...">
    
    <div class="btn-group">
        <button class="btn-mp4" onclick="processar('mp4')">Baixar MP4 (Vídeo)</button>
        <button class="btn-mp3" onclick="processar('mp3')">Baixar MP3 (Áudio)</button>
    </div>

    <p class="alerta">* O download será processado automaticamente na próxima página.</p>
</div>

<script>
function processar(formato) {
    const urlInput = document.getElementById('urlVideo').value.trim();
    if (!urlInput) {
        alert('Por favor, insira um link do YouTube válido!');
        return;
    }
    
    // Extrator simples de ID do YouTube para compatibilidade
    let videoId = "";
    if (urlInput.includes("youtu.be/")) {
        videoId = urlInput.split("youtu.be/")[1].split(/[?#]/)[0];
    } else if (urlInput.includes("watch?v=")) {
        videoId = urlInput.split("watch?v=")[1].split(/[&#]/)[0];
    } else if (urlInput.includes("shorts/")) {
        videoId = urlInput.split("shorts/")[1].split(/[?#]/)[0];
    } else {
        videoId = urlInput; // Fallback caso coloquem só o ID
    }

    if (!videoId || videoId.length < 5) {
        alert('Não encontramos um ID de vídeo válido nesta URL. Copie o link novamente.');
        return;
    }

    // Usando o gateway do y2mate/y2api que processa o ID do vídeo de forma mais direta
    let redirecionamentoUrl = "";
    if (formato === 'mp3') {
        redirecionamentoUrl = `https://y2mate.com{videoId}`;
    } else {
        redirecionamentoUrl = `https://y2mate.com{videoId}`;
    }
    
    window.open(redirecionamentoUrl, '_blank');
}
</script>

</body>
</html>
